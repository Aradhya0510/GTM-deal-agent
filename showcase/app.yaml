command:
  - streamlit
  - run
  - app.py

resources:
  - name: deal-intelligence-endpoint
    serving_endpoint:
      name: ${SERVING_ENDPOINT_NAME}  # TODO: your agent serving endpoint name
      permission: CAN_QUERY
  - name: lakebase-memory
    database:
      instance_name: ${LAKEBASE_INSTANCE_NAME}  # TODO: your Lakebase instance name
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
