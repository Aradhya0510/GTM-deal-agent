command:
  - streamlit
  - run
  - app.py

# CONFIGURE: Replace resource names with your actual asset names.
# See .env.example for the full list of required configuration.
resources:
  - name: deal-intelligence-endpoint
    serving_endpoint:
      name: your-serving-endpoint-name
      permission: CAN_QUERY
  - name: lakebase-memory
    database:
      instance_name: your-lakebase-instance
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
